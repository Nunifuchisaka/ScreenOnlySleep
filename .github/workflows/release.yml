name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName src\ScreenOnlySleep\bin\Release\net48\ScreenOnlySleep.exe --title "${{ github.ref_name }}" --generate-notes
